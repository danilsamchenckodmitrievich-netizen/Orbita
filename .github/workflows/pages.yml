name: Deploy to GitHub Pages

# Проверяет задания на каждом push и pull request.
# Публикует сайт сам, только если в Settings → Pages выбран источник «GitHub Actions».
# Если выбран «Deploy from a branch» (main, /root), сайт публикует сам GitHub,
# а этот workflow только проверяет контент.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/validate.mjs

  build:
    name: Build site
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - name: Check Pages source
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $type"
          if [ "$type" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages публикует сайт из ветки — отдельная публикация не нужна."
          fi
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/checkout@v6
      - name: Assemble _site
        if: steps.mode.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp -r index.html 404.html manifest.webmanifest assets _site/
          # Уникальная версия файлов, чтобы браузеры не держали старый кэш после обновления
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
